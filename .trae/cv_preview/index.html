<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>CV 预览 - 郭祥</title>
<style>
  body { margin: 0; background: #525659; font-family: "Microsoft YaHei", sans-serif; }
  .bar { position: sticky; top: 0; background: #323639; color: #fff; padding: 10px 20px; font-size: 14px; z-index: 9; }
  .bar b { font-size: 16px; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 18px 8px 40px; }
  .page { background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.45); line-height: 0; }
  .page img { width: 900px; max-width: 96vw; }
  .tag { position: relative; }
  .tag span { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 1; padding: 5px 8px; border-radius: 3px; }
</style>
</head>
<body>
<div class="bar"><b>郭祥 CV 预览</b>　（共 9 页 · A4 · files/cv.pdf）</div>
<div class="wrap">
  <div class="page tag"><span>第 1 页 · 个人信息与简介</span><img src="p1.png" alt="p1"></div>
  <div class="page tag"><span>第 2 页</span><img src="p2.png" alt="p2"></div>
  <div class="page tag"><span>第 3 页 · 学术论文</span><img src="p3.png" alt="p3"></div>
  <div class="page tag"><span>第 4 页 · 学术论文（续）</span><img src="p4.png" alt="p4"></div>
  <div class="page tag"><span>第 5 页</span><img src="p5.png" alt="p5"></div>
  <div class="page tag"><span>第 6 页</span><img src="p6.png" alt="p6"></div>
  <div class="page tag"><span>第 7 页</span><img src="p7.png" alt="p7"></div>
  <div class="page tag"><span>第 8 页</span><img src="p8.png" alt="p8"></div>
  <div class="page tag"><span>第 9 页 · 科技报告</span><img src="p9.png" alt="p9"></div>
</div>
</body>
</html>
