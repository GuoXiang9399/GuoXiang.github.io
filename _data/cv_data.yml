bio:
- 河南大学基础医学院副教授，河南大学深圳研究院病原和媒介生物创新研究中心主任。2017 年南方医科大学公共卫生学院预防医学专业本科，2023 年南方医科大学病原生物学专业博士，南方医科大学公共卫生学院军事预防医学博士后。
- 主要研究方向为蚊媒病毒流行与进化、伊蚊野外生态行为和病毒蚊虫感染机制，提出了可比较和可追踪的全球登革病毒统一基因分型框架，发现登革病毒洲际-基因型、区域-基因亚型和国家-基因分支对应层面展的地理限制性特征，构建了 GISDD 分型平台网站。于 Interdisciplinary Medicine、iMetaOmics、Infectious Diseases of Poverty 等期刊发表多篇 SCI 论文，申请/授权发明专利 4 项，获授权实用新型专利 3 项。参与起草国家标准 1 项，以主要起草人撰写团体标准 2 项。
- 作为项目负责人主持国家自然科学基金青年项目、国家科技基础条件平台国家寄生虫资源库项目和广东省爱卫办“揭榜挂帅”项目等。参与国家重点研发计划、广东省重点领域研发计划、国家自然科学基金面上项目、广东省科技攻关专项等重要科技项目。
- iMeta、Interdisciplinary Medicine、Decoding Infection and Transmission 等学术期刊青年编委，BMC Infectious Diseases 学术期刊编辑，STAR Protocols 等学术期刊审稿人。
